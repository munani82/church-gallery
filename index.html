<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 보안 차단 방지 및 외부 링크 허용 설정 -->
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    
    <title>서대구제일교회 갤러리 및 주보</title>
    <meta name="description" content="서대구제일교회 최신 활동 사진 갤러리 및 주보 서비스">
    
    <!-- Pretendard Font 및 FontAwesome Icons CDN -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --header-bg: rgba(255, 255, 255, 0.94);
            --dock-bg: rgba(255, 255, 255, 0.95);
            --border-color: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --heart-color: #ef4444;
            --card-radius: 16px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 25px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
            --shadow-dock: 0 -4px 20px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            color: var(--text-primary);
            line-height: 1.5;
            padding-bottom: 130px;
            word-break: keep-all;
            overflow-wrap: break-word;
            -webkit-font-smoothing: antialiased;
        }

        /* Sticky Header */
        header {
            position: sticky;
            top: 0;
            background-color: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
            transition: all 0.3s ease;
        }

        .header-content {
            max-width: 680px;
            margin: 0 auto;
            padding: 12px 16px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            min-width: 0;
            flex-shrink: 1;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            min-width: 38px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.15rem;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.28);
        }

        .logo-text {
            min-width: 0;
        }

        .logo-text h1 {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: keep-all;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .refresh-btn, .origin-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            text-decoration: none;
            background-color: #fff;
            white-space: nowrap;
        }

        .refresh-btn:hover, .origin-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Category Segmented Navigation Tabs */
        .category-nav-wrapper {
            max-width: 680px;
            margin: 0 auto;
            padding: 4px 16px 10px;
        }

        .category-segmented-control {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 14px;
            gap: 4px;
            border: 1px solid #e2e8f0;
        }

        .cat-tab-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px;
            border: none;
            background: transparent;
            color: #64748b;
            font-size: 0.88rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .cat-tab-btn i {
            font-size: 0.95rem;
        }

        .cat-tab-btn:hover {
            color: #0f172a;
        }

        .cat-tab-btn.active {
            background: #ffffff;
            color: #0284c7;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .cat-badge-count {
            display: inline-block;
            font-size: 0.72rem;
            padding: 2px 6px;
            border-radius: 20px;
            background: #e2e8f0;
            color: #475569;
            font-weight: 600;
        }

        .cat-tab-btn.active .cat-badge-count {
            background: #e0f2fe;
            color: #0284c7;
        }

        /* Feed Container */
        .feed-container {
            max-width: 680px;
            margin: 0 auto;
            padding: 12px 16px 8px;
        }

        .feed-stats {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 14px;
            padding: 0 4px;
            font-weight: 500;
        }

        /* Post Card */
        .post-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 24px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .post-card:hover {
            box-shadow: var(--shadow-md);
        }

        .post-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .author-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            font-size: 1rem;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .author-avatar.bulletin-avatar {
            background: #fef3c7;
            color: #d97706;
            border-color: #fde68a;
        }

        .author-meta {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .author-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .author-name {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .post-badge {
            font-size: 0.72rem;
            padding: 2px 7px;
            border-radius: 6px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-album {
            background: #e0f2fe;
            color: #0369a1;
        }

        .badge-bulletin {
            background: #fef3c7;
            color: #b45309;
        }

        .post-category {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 1px;
        }

        /* Carousel Wrapper */
        .carousel-wrapper {
            position: relative;
            width: 100%;
            background-color: #0b0f19;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: height 0.25s ease-out;
        }

        .carousel-track {
            display: flex;
            width: 100%;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .carousel-track::-webkit-scrollbar {
            display: none;
        }

        .carousel-slide {
            flex: 0 0 100%;
            width: 100%;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .carousel-slide img {
            width: 100%;
            height: auto;
            max-height: 82vh;
            object-fit: contain;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        .slide-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            color: #ffffff;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            z-index: 10;
            pointer-events: none;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(4px);
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.18);
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s ease;
        }

        .carousel-btn:hover {
            background: #ffffff;
            transform: translateY(-50%) scale(1.08);
        }

        .carousel-btn.prev {
            left: 12px;
        }

        .carousel-btn.next {
            right: 12px;
        }

        /* Post Actions & Dots */
        .post-actions {
            padding: 10px 16px 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .action-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.15rem;
            color: var(--text-primary);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, color 0.15s ease;
        }

        .action-btn:active {
            transform: scale(0.88);
        }

        .action-btn.saved {
            color: #eab308;
        }

        .carousel-dots {
            display: flex;
            align-items: center;
            gap: 5px;
            max-width: 140px;
            overflow: hidden;
            padding: 4px 0;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #cbd5e1;
            transition: all 0.2s ease;
        }

        .dot.active {
            background-color: var(--accent-color);
            width: 18px;
            border-radius: 4px;
        }

        /* Post Body */
        .post-body {
            padding: 4px 16px 14px;
        }

        .post-caption {
            font-size: 0.93rem;
            color: var(--text-primary);
            line-height: 1.45;
            font-weight: 500;
        }

        .post-title-text {
            font-weight: 600;
        }

        .post-tags {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag-link {
            font-size: 0.8rem;
            color: var(--accent-color);
            font-weight: 600;
            cursor: pointer;
            background: #f0f9ff;
            padding: 2px 8px;
            border-radius: 6px;
            transition: background-color 0.15s ease;
        }

        .tag-link:hover {
            background-color: #e0f2fe;
        }

        /* Skeleton Loading */
        .skeleton-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            margin-bottom: 24px;
            overflow: hidden;
        }

        .skeleton-header {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .skeleton-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e2e8f0;
            animation: pulse 1.5s infinite;
        }

        .skeleton-title {
            width: 160px;
            height: 14px;
            border-radius: 4px;
            background: #e2e8f0;
            animation: pulse 1.5s infinite;
        }

        .skeleton-media {
            width: 100%;
            height: 320px;
            background: #f1f5f9;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        /* Bottom Floating Search & Filter Dock */
        .bottom-dock {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--dock-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color);
            box-shadow: var(--shadow-dock);
            padding: 10px 16px 20px;
            z-index: 90;
        }

        .dock-content {
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tags-container {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 2px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .tags-container::-webkit-scrollbar {
            display: none;
        }

        .tag-chip {
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            user-select: none;
        }

        .tag-chip:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .tag-chip.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.35);
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 0.95rem;
            pointer-events: none;
        }

        .search-box input {
            width: 100%;
            padding: 10px 38px 10px 40px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: #f8fafc;
            font-size: 0.9rem;
            font-family: inherit;
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s ease;
        }

        .search-box input:focus {
            background-color: #ffffff;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .search-clear-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            display: none;
            padding: 4px;
        }

        /* Lightbox Modal */
        .lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: none;
        }

        .lightbox-modal.show {
            display: flex;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #ffffff;
            font-size: 1.5rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1010;
            transition: background 0.2s ease;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .lightbox-img-wrapper {
            position: relative;
            max-width: 95vw;
            max-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }

        .lightbox-img-wrapper img {
            max-width: 95vw;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transform-origin: center center;
            transition: transform 0.08s ease-out;
            cursor: grab;
        }

        .lightbox-zoom-hint {
            position: absolute;
            bottom: 74px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 12px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lightbox-title {
            position: absolute;
            top: 24px;
            left: 24px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            max-width: 70vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lightbox-actions {
            position: absolute;
            bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lightbox-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .lightbox-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: #ffffff;
        }

        /* Toast Message */
        .toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(6px);
            color: #ffffff;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-content">
            <a href="#" class="logo-area" onclick="window.scrollTo({top:0, behavior:'smooth'}); return false;">
                <div class="logo-icon">
                    <i class="fa-solid fa-church"></i>
                </div>
                <div class="logo-text">
                    <h1>서대구제일교회</h1>
                </div>
            </a>
            <div class="header-actions">
                <button class="refresh-btn" onclick="fetchPhotos(true)">
                    <i class="fa-solid fa-rotate-right"></i> 새로고침
                </button>
                <a id="origin-board-link" href="http://www.seodaegu.net/main/sub.html?pageCode=25" target="_blank" rel="noopener noreferrer" class="origin-btn">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> 원본게시판
                </a>
            </div>
        </div>

        <!-- 분리된 카테고리 탭 (전체, 교회앨범, 주보) -->
        <nav class="category-nav-wrapper">
            <div class="category-segmented-control">
                <button class="cat-tab-btn active" data-category="all" onclick="selectCategory('all')">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>전체보기</span>
                    <span class="cat-badge-count" id="count-all">0</span>
                </button>
                <button class="cat-tab-btn" data-category="album" onclick="selectCategory('album')">
                    <i class="fa-solid fa-camera"></i>
                    <span>교회앨범</span>
                    <span class="cat-badge-count" id="count-album">0</span>
                </button>
                <button class="cat-tab-btn" data-category="bulletin" onclick="selectCategory('bulletin')">
                    <i class="fa-solid fa-book-bible"></i>
                    <span>주보</span>
                    <span class="cat-badge-count" id="count-bulletin">0</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Feed Container -->
    <main class="feed-container">
        <div class="feed-stats">
            <span id="posts-count">게시글 불러오는 중...</span>
            <span id="photos-total-count"></span>
        </div>
        
        <div id="gallery-feed">
            <div class="skeleton-card">
                <div class="skeleton-header">
                    <div class="skeleton-avatar"></div>
                    <div class="skeleton-title"></div>
                </div>
                <div class="skeleton-media"></div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-header">
                    <div class="skeleton-avatar"></div>
                    <div class="skeleton-title"></div>
                </div>
                <div class="skeleton-media"></div>
            </div>
        </div>

        <div id="infinite-scroll-trigger" style="height: 40px; text-align: center; color: #94a3b8; font-size: 0.85rem; padding: 10px;">
            불러오는 중...
        </div>
    </main>

    <!-- Bottom Floating Search & Filter Dock -->
    <div class="bottom-dock">
        <div class="dock-content">
            <!-- Tag Filter Bar (동적 생성) -->
            <div class="tags-container" id="tags-container">
                <button class="tag-chip active" data-filter="all">전체</button>
            </div>
            <!-- Search Box -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="search-input" placeholder="게시글 제목, 행사명, 날짜 검색..." autocomplete="off">
                <button class="search-clear-btn" id="search-clear" onclick="clearSearch()">&times;</button>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div class="lightbox-modal" id="lightbox-modal" onclick="closeLightbox(event)">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <div class="lightbox-img-wrapper" id="lightbox-wrapper">
            <img id="lightbox-img" src="" alt="확대 사진">
        </div>
        <div class="lightbox-zoom-hint">
            <i class="fa-solid fa-up-right-and-down-left-from-center"></i> 두 손가락으로 확대하거나 마우스 휠로 줌하세요
        </div>
        <div class="lightbox-title" id="lightbox-title"></div>
        <div class="lightbox-actions">
            <a id="lightbox-origin-link" href="#" target="_blank" class="lightbox-btn" download>
                <i class="fa-solid fa-download"></i> 원본 저장
            </a>
            <button class="lightbox-btn" onclick="shareCurrentPhoto()">
                <i class="fa-solid fa-share-nodes"></i> 링크 복사
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">알림 메시지</div>

    <script>
        // 전역 상태
        let allPosts = [];
        let filteredPosts = [];
        let renderedCount = 0;
        const PAGE_SIZE = 8;
        let activeCategory = 'all'; // 'all', 'album', 'bulletin'
        let activeTag = 'all';
        let searchQuery = '';
        const userSavedIds = new Set(JSON.parse(localStorage.getItem('church_saved_posts') || '[]'));

        // 주요 행사 및 부서 키워드 사전
        const KEYWORD_CANDIDATES = [
            '청년부', '유초등부', '유치부', '중고등부', '남전도회', '여전도회',
            '성경학교', '수련회', '헌신예배', '부흥회', '야유회', '찬양',
            '세례식', '임직식', '구역', '주일학교', '체육대회', '성탄', '부활절', '새가족'
        ];

        // 이미지 프록시 헬퍼 (HTTPS 혼합 컨텐츠 방지 및 빠른 로딩)
        function getSafeImageUrl(url) {
            if (!url) return '';
            const cleanUrl = url.replace(/^https?:\/\//i, '');
            return `https://images.weserv.nl/?url=${encodeURIComponent(cleanUrl)}`;
        }

        // 평탄화된 사진 목록을 게시물 단위로 그룹화
        function groupPhotosByTitle(flatPhotos) {
            const posts = [];
            let currentPost = null;

            flatPhotos.forEach((item, index) => {
                const title = (item.title || '서대구제일교회 사진').trim();
                const itemCategory = item.category || (item.img && item.img.includes('www24') ? 'bulletin' : 'album');
                
                if (currentPost && currentPost.title === title && currentPost.category === itemCategory) {
                    currentPost.images.push(item.img);
                } else {
                    currentPost = {
                        id: 'post_' + index + '_' + Math.random().toString(36).substr(2, 5),
                        title: title,
                        category: itemCategory,
                        images: [item.img],
                        date: extractDate(title)
                    };
                    posts.push(currentPost);
                }
            });

            return posts;
        }

        // 제목에서 날짜 추출
        function extractDate(title) {
            const match = title.match(/\((\d{1,2}\.\d{1,2}\.?\d{0,2}[^)]*)\)/);
            if (match) return match[1];
            const korMatch = title.match(/(\d{2}년\s*\d{1,2}월\s*\d{1,2}일)/);
            if (korMatch) return korMatch[1];
            return '';
        }

        // 제목에서 키워드 태그 추출
        function extractTagsFromTitle(title) {
            const matched = [];
            KEYWORD_CANDIDATES.forEach(keyword => {
                if (title.includes(keyword)) {
                    matched.push(keyword);
                }
            });
            return matched;
        }

        // 카테고리 탭 선택 핸들러
        function selectCategory(category) {
            activeCategory = category;
            activeTag = 'all';

            // 탭 활성 상태 변경
            document.querySelectorAll('.cat-tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === category);
            });

            // 원본 게시판 링크 동적 전환
            const originLink = document.getElementById('origin-board-link');
            if (originLink) {
                if (category === 'bulletin') {
                    originLink.href = 'http://www.seodaegu.net/main/sub.html?pageCode=24';
                    originLink.innerHTML = '<i class="fa-solid fa-arrow-up-right-from-square"></i> 원본주보';
                } else {
                    originLink.href = 'http://www.seodaegu.net/main/sub.html?pageCode=25';
                    originLink.innerHTML = '<i class="fa-solid fa-arrow-up-right-from-square"></i> 원본게시판';
                }
            }

            // 하단 태그 동적 재배치 및 필터 적용
            generateDynamicTags();
            applyFilter();
            window.scrollTo({ top: 0, behavior: 'smooth' });

            const catNames = { all: '전체', album: '교회앨범', bulletin: '주보' };
            showToast(`${catNames[category] || '카테고리'} 목록으로 전환되었습니다.`);
        }

        // 게시글 내 태그 클릭 시 필터링
        function clickPostTag(tag) {
            activeTag = tag;
            const chips = document.querySelectorAll('.tag-chip');
            chips.forEach(c => {
                c.classList.toggle('active', c.dataset.filter === tag);
            });
            applyFilter();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast(`'#${tag}' 게시글로 필터링되었습니다.`);
        }

        // 현재 카테고리에 맞는 동적 태그 생성
        function generateDynamicTags() {
            const currentCatPosts = (activeCategory === 'all') 
                ? allPosts 
                : allPosts.filter(p => p.category === activeCategory);

            const counts = {};
            currentCatPosts.forEach(post => {
                KEYWORD_CANDIDATES.forEach(keyword => {
                    if (post.title.includes(keyword)) {
                        counts[keyword] = (counts[keyword] || 0) + 1;
                    }
                });
            });

            const sortedKeywords = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
            const tagsContainer = document.getElementById('tags-container');
            let html = `<button class="tag-chip ${activeTag === 'all' ? 'active' : ''}" data-filter="all">전체</button>`;

            sortedKeywords.forEach(kw => {
                const isActive = (activeTag === kw);
                html += `<button class="tag-chip ${isActive ? 'active' : ''}" data-filter="${kw}">${kw} (${counts[kw]})</button>`;
            });

            tagsContainer.innerHTML = html;
        }

        // 카테고리별 뱃지 카운트 갱신
        function updateCategoryCounts() {
            const countAll = allPosts.length;
            const countAlbum = allPosts.filter(p => p.category === 'album').length;
            const countBulletin = allPosts.filter(p => p.category === 'bulletin').length;

            const elAll = document.getElementById('count-all');
            const elAlbum = document.getElementById('count-album');
            const elBulletin = document.getElementById('count-bulletin');

            if (elAll) elAll.textContent = countAll;
            if (elAlbum) elAlbum.textContent = countAlbum;
            if (elBulletin) elBulletin.textContent = countBulletin;
        }

        // 데이터 불러오기
        async function fetchPhotos(isRefresh = false) {
            const feed = document.getElementById('gallery-feed');
            if (isRefresh) {
                showToast('최신 데이터를 동기화하고 있습니다...');
            }

            try {
                const response = await fetch('photos.json?v=' + Date.now());
                if (!response.ok) throw new Error('데이터 로드 실패');
                const rawPhotos = await response.json();

                allPosts = groupPhotosByTitle(rawPhotos);
                
                updateCategoryCounts();
                generateDynamicTags();
                applyFilter();

                const totalPhotosCount = rawPhotos.length;
                document.getElementById('photos-total-count').textContent = `총 ${totalPhotosCount.toLocaleString()}장의 사진`;
                
                if (isRefresh) {
                    showToast('최신 사진 및 주보 목록을 불러왔습니다!');
                }
            } catch (err) {
                console.error(err);
                feed.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; color: #ef4444;">
                        <i class="fa-solid fa-circle-exclamation" style="font-size: 2rem; margin-bottom: 12px;"></i>
                        <p>사진 데이터를 불러오는데 실패했습니다.</p>
                        <button onclick="fetchPhotos(true)" style="margin-top:12px; padding: 8px 16px; border-radius: 8px; background: #0284c7; color:#fff; border:none; cursor:pointer;">
                            다시 시도
                        </button>
                    </div>
                `;
            }
        }

        // 필터 및 검색 적용 로직
        function applyFilter() {
            filteredPosts = allPosts.filter(post => {
                const matchesCategory = (activeCategory === 'all') || (post.category === activeCategory);
                const matchesTag = (activeTag === 'all') || post.title.includes(activeTag);
                const matchesSearch = !searchQuery || post.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesTag && matchesSearch;
            });

            renderedCount = 0;
            const feed = document.getElementById('gallery-feed');
            feed.innerHTML = '';

            const catNames = { all: '', album: '앨범 ', bulletin: '주보 ' };
            document.getElementById('posts-count').textContent = `${catNames[activeCategory] || ''}게시물 ${filteredPosts.length}개`;

            if (filteredPosts.length === 0) {
                feed.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; color: #64748b;">
                        <i class="fa-solid fa-folder-open" style="font-size: 2.5rem; margin-bottom: 14px; opacity: 0.4;"></i>
                        <p style="font-size: 1rem; font-weight: 600;">해당 조건에 맞는 게시글이 없습니다.</p>
                        <p style="font-size: 0.85rem; margin-top: 4px;">다른 카테고리나 하단 태그를 선택해보세요.</p>
                    </div>
                `;
                document.getElementById('infinite-scroll-trigger').style.display = 'none';
                return;
            }

            document.getElementById('infinite-scroll-trigger').style.display = 'block';
            renderNextBatch();
        }

        // 인피니트 스크롤 배치 렌더링
        function renderNextBatch() {
            const nextBatch = filteredPosts.slice(renderedCount, renderedCount + PAGE_SIZE);
            if (nextBatch.length === 0) {
                document.getElementById('infinite-scroll-trigger').style.display = 'none';
                return;
            }

            const feed = document.getElementById('gallery-feed');
            const fragment = document.createDocumentFragment();

            nextBatch.forEach(post => {
                const card = createPostCard(post);
                fragment.appendChild(card);
            });

            feed.appendChild(fragment);
            renderedCount += nextBatch.length;

            if (renderedCount >= filteredPosts.length) {
                document.getElementById('infinite-scroll-trigger').style.display = 'none';
            }
        }

        // 인스타그램 피드 형태 카드 생성
        function createPostCard(post) {
            const card = document.createElement('article');
            card.className = 'post-card';
            card.id = post.id;

            const isSaved = userSavedIds.has(post.id);
            const imageCount = post.images.length;
            const isBulletin = post.category === 'bulletin';

            // 태그 추출
            const matchedTags = extractTagsFromTitle(post.title);
            let tagsHtml = '';
            if (matchedTags.length > 0) {
                tagsHtml = `<div class="post-tags">` + 
                    matchedTags.map(t => `<span class="tag-link" onclick="clickPostTag('${t}')">#${t}</span>`).join('') + 
                    `</div>`;
            }

            // 슬라이드 HTML 생성
            let slidesHtml = '';
            let dotsHtml = '';

            post.images.forEach((imgUrl, idx) => {
                const safeUrl = getSafeImageUrl(imgUrl);
                slidesHtml += `
                    <div class="carousel-slide" onclick="openLightbox('${safeUrl}', '${post.title.replace(/'/g, "\\'")}', '${imgUrl}')">
                        <img src="${safeUrl}" 
                             alt="${post.title} 사진 ${idx + 1}" 
                             loading="lazy"
                             onload="onSlideImgLoad(this, ${idx})"
                             onerror="this.onerror=null; this.src='${imgUrl}';">
                    </div>
                `;
                if (imageCount > 1) {
                    dotsHtml += `<div class="dot ${idx === 0 ? 'active' : ''}"></div>`;
                }
            });

            const badgeHtml = isBulletin
                ? `<span class="post-badge badge-bulletin"><i class="fa-solid fa-book-bible"></i> 주보</span>`
                : `<span class="post-badge badge-album"><i class="fa-solid fa-camera"></i> 앨범</span>`;

            const avatarClass = isBulletin ? 'author-avatar bulletin-avatar' : 'author-avatar';
            const avatarIcon = isBulletin ? 'fa-solid fa-book-open' : 'fa-solid fa-church';

            card.innerHTML = `
                <div class="post-header">
                    <div class="author-info">
                        <div class="${avatarClass}">
                            <i class="${avatarIcon}"></i>
                        </div>
                        <div class="author-meta">
                            <div class="author-name-row">
                                <span class="author-name">서대구제일교회</span>
                                ${badgeHtml}
                            </div>
                            <span class="post-category">${post.date ? '📅 ' + post.date : (isBulletin ? '주일 주보' : '교회 갤러리')} · 사진 ${imageCount}장</span>
                        </div>
                    </div>
                    <button class="action-btn" title="공유하기" onclick="sharePost('${post.title.replace(/'/g, "\\'")}', '${post.id}')">
                        <i class="fa-regular fa-paper-plane" style="font-size: 1.1rem; color:#64748b;"></i>
                    </button>
                </div>

                <div class="carousel-wrapper" data-total="${imageCount}">
                    ${imageCount > 1 ? `<div class="slide-badge"><span class="current-slide">1</span>/${imageCount}</div>` : ''}
                    
                    <div class="carousel-track" onscroll="handleTrackScroll(this)">
                        ${slidesHtml}
                    </div>

                    ${imageCount > 1 ? `
                        <button class="carousel-btn prev" onclick="scrollCarousel(this, -1)" style="display:none;" aria-label="이전 사진">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <button class="carousel-btn next" onclick="scrollCarousel(this, 1)" aria-label="다음 사진">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    ` : ''}
                </div>

                <div class="post-actions">
                    <div class="action-left">
                        <button class="action-btn ${isSaved ? 'saved' : ''}" onclick="toggleSave('${post.id}', this)" title="보관함 저장">
                            <i class="${isSaved ? 'fa-solid' : 'fa-regular'} fa-bookmark"></i>
                        </button>
                        <button class="action-btn" onclick="sharePost('${post.title.replace(/'/g, "\\'")}', '${post.id}')" title="링크 공유">
                            <i class="fa-regular fa-share-from-square"></i>
                        </button>
                    </div>
                    
                    ${imageCount > 1 ? `<div class="carousel-dots">${dotsHtml}</div>` : ''}
                </div>

                <div class="post-body">
                    <div class="post-caption">
                        <span class="post-title-text">${post.title}</span>
                    </div>
                    ${tagsHtml}
                </div>
            `;

            return card;
        }

        // 슬라이드 높이 자동 보정
        function onSlideImgLoad(img, slideIndex) {
            const wrapper = img.closest('.carousel-wrapper');
            if (!wrapper) return;
            const badge = wrapper.querySelector('.current-slide');
            const currentIdx = badge ? parseInt(badge.textContent, 10) - 1 : 0;
            if (slideIndex === currentIdx || slideIndex === 0) {
                if (img.offsetHeight > 0) {
                    wrapper.style.height = img.offsetHeight + 'px';
                }
            }
        }

        // 캐러셀 스크롤 및 인디케이터 업데이트
        function handleTrackScroll(track) {
            const wrapper = track.closest('.carousel-wrapper');
            const total = parseInt(wrapper.dataset.total, 10);
            if (total <= 1) return;

            const scrollLeft = track.scrollLeft;
            const slideWidth = track.offsetWidth;
            const currentIndex = Math.round(scrollLeft / slideWidth);

            const badgeCurrent = wrapper.querySelector('.current-slide');
            if (badgeCurrent) {
                badgeCurrent.textContent = currentIndex + 1;
            }

            const postCard = wrapper.closest('.post-card');
            if (postCard) {
                const dots = postCard.querySelectorAll('.carousel-dots .dot');
                dots.forEach((dot, idx) => {
                    dot.classList.toggle('active', idx === currentIndex);
                });
            }

            const prevBtn = wrapper.querySelector('.carousel-btn.prev');
            const nextBtn = wrapper.querySelector('.carousel-btn.next');
            if (prevBtn) prevBtn.style.display = currentIndex === 0 ? 'none' : 'flex';
            if (nextBtn) nextBtn.style.display = currentIndex >= total - 1 ? 'none' : 'flex';

            const activeImg = track.children[currentIndex]?.querySelector('img');
            if (activeImg && activeImg.offsetHeight > 0) {
                wrapper.style.height = activeImg.offsetHeight + 'px';
            }
        }

        // 캐러셀 좌우 버튼 이동
        function scrollCarousel(btn, direction) {
            const wrapper = btn.closest('.carousel-wrapper');
            const track = wrapper.querySelector('.carousel-track');
            const slideWidth = track.offsetWidth;
            track.scrollBy({ left: direction * slideWidth, behavior: 'smooth' });
        }

        // 저장(북마크) 토글
        function toggleSave(postId, btn) {
            const icon = btn.querySelector('i');
            if (userSavedIds.has(postId)) {
                userSavedIds.delete(postId);
                btn.classList.remove('saved');
                icon.className = 'fa-regular fa-bookmark';
                showToast('보관함에서 제거되었습니다.');
            } else {
                userSavedIds.add(postId);
                btn.classList.add('saved');
                icon.className = 'fa-solid fa-bookmark';
                showToast('보관함에 저장되었습니다.');
            }
            localStorage.setItem('church_saved_posts', JSON.stringify(Array.from(userSavedIds)));
        }

        // 라이트박스 상태 및 줌 기능
        let currentPhotoUrl = '';
        let zoomScale = 1;
        let zoomTransX = 0;
        let zoomTransY = 0;
        let isDragging = false;
        let startDragX = 0;
        let startDragY = 0;

        function openLightbox(safeUrl, title, rawUrl) {
            const modal = document.getElementById('lightbox-modal');
            const img = document.getElementById('lightbox-img');
            const titleEl = document.getElementById('lightbox-title');
            const originLink = document.getElementById('lightbox-origin-link');

            currentPhotoUrl = rawUrl || safeUrl;
            img.src = safeUrl;
            titleEl.textContent = title;
            originLink.href = rawUrl || safeUrl;

            resetZoom(true);
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox(e) {
            if (e && e.target && e.target.closest('#lightbox-wrapper, .lightbox-actions, .lightbox-zoom-hint')) {
                return;
            }
            const modal = document.getElementById('lightbox-modal');
            modal.classList.remove('show');
            document.body.style.overflow = '';
            resetZoom(true);
        }

        function resetZoom(animated = false) {
            const img = document.getElementById('lightbox-img');
            zoomScale = 1;
            zoomTransX = 0;
            zoomTransY = 0;
            if (img) {
                img.style.transition = animated ? 'transform 0.2s ease' : 'none';
                img.style.transform = `translate(0px, 0px) scale(1)`;
                img.style.cursor = 'grab';
            }
        }

        function applyZoomTransform(animated = false) {
            const img = document.getElementById('lightbox-img');
            if (!img) return;
            img.style.transition = animated ? 'transform 0.15s ease' : 'none';
            img.style.transform = `translate(${zoomTransX}px, ${zoomTransY}px) scale(${zoomScale})`;
        }

        function shareCurrentPhoto() {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(currentPhotoUrl);
                showToast('사진 주소가 복사되었습니다!');
            } else {
                showToast('사진 주소 복사를 지원하지 않는 브라우저입니다.');
            }
        }

        // 줌 및 터치 제스처 초기화
        function initLightboxZoomEvents() {
            const wrapper = document.getElementById('lightbox-wrapper');
            const img = document.getElementById('lightbox-img');
            if (!wrapper || !img) return;

            let initialPinchDist = 0;
            let initialScale = 1;
            let lastTapTime = 0;

            // 더블 탭 확대
            wrapper.addEventListener('touchend', (e) => {
                const currentTime = new Date().getTime();
                const tapInterval = currentTime - lastTapTime;
                if (tapInterval < 300 && tapInterval > 0) {
                    e.preventDefault();
                    if (zoomScale > 1.2) {
                        resetZoom(true);
                    } else {
                        zoomScale = 2.5;
                        zoomTransX = 0;
                        zoomTransY = 0;
                        applyZoomTransform(true);
                    }
                }
                lastTapTime = currentTime;
            });

            // 핀치 줌 (모바일 터치)
            wrapper.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    initialPinchDist = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    initialScale = zoomScale;
                } else if (e.touches.length === 1 && zoomScale > 1) {
                    isDragging = true;
                    startDragX = e.touches[0].pageX - zoomTransX;
                    startDragY = e.touches[0].pageY - zoomTransY;
                }
            }, { passive: false });

            wrapper.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const currentDist = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    if (initialPinchDist > 0) {
                        const factor = currentDist / initialPinchDist;
                        zoomScale = Math.min(Math.max(initialScale * factor, 1), 4.5);
                        applyZoomTransform(false);
                    }
                } else if (e.touches.length === 1 && isDragging && zoomScale > 1) {
                    e.preventDefault();
                    zoomTransX = e.touches[0].pageX - startDragX;
                    zoomTransY = e.touches[0].pageY - startDragY;
                    applyZoomTransform(false);
                }
            }, { passive: false });

            wrapper.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) {
                    initialPinchDist = 0;
                }
                if (e.touches.length === 0) {
                    isDragging = false;
                    if (zoomScale <= 1.05) {
                        resetZoom(true);
                    }
                }
            });

            // 데스크톱 휠 줌
            wrapper.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY * -0.002;
                zoomScale = Math.min(Math.max(zoomScale + delta, 1), 4.5);
                if (zoomScale <= 1.05) {
                    resetZoom(true);
                } else {
                    applyZoomTransform(false);
                }
            }, { passive: false });

            // 데스크톱 마우스 드래그
            wrapper.addEventListener('mousedown', (e) => {
                if (zoomScale > 1) {
                    isDragging = true;
                    startDragX = e.clientX - zoomTransX;
                    startDragY = e.clientY - zoomTransY;
                    img.style.cursor = 'grabbing';
                    e.preventDefault();
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (isDragging && zoomScale > 1) {
                    zoomTransX = e.clientX - startDragX;
                    zoomTransY = e.clientY - startDragY;
                    applyZoomTransform(false);
                }
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    img.style.cursor = zoomScale > 1 ? 'grab' : 'default';
                }
            });
        }

        // 공유하기
        function sharePost(title, postId) {
            if (navigator.clipboard) {
                const url = window.location.href.split('#')[0] + '#' + postId;
                navigator.clipboard.writeText(url);
                showToast(`'${title}' 링크가 복사되었습니다!`);
            } else {
                showToast('링크가 복사되었습니다.');
            }
        }

        // 토스트 알림 헬퍼
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // 검색어 입력 핸들러 (디바운스)
        let searchTimeout;
        const searchInput = document.getElementById('search-input');
        const searchClearBtn = document.getElementById('search-clear');

        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const val = e.target.value;
            searchClearBtn.style.display = val ? 'block' : 'none';
            searchTimeout = setTimeout(() => {
                searchQuery = val.trim();
                applyFilter();
            }, 300);
        });

        function clearSearch() {
            searchInput.value = '';
            searchClearBtn.style.display = 'none';
            searchQuery = '';
            applyFilter();
        }

        // 태그 칩 필터 핸들러
        document.getElementById('tags-container').addEventListener('click', (e) => {
            const chip = e.target.closest('.tag-chip');
            if (!chip) return;

            document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');

            activeTag = chip.dataset.filter;
            applyFilter();
        });

        // 무한 스크롤 옵저버
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                if (renderedCount < filteredPosts.length) {
                    renderNextBatch();
                }
            }
        }, { rootMargin: '200px' });

        observer.observe(document.getElementById('infinite-scroll-trigger'));

        // ESC 키로 라이트박스 닫기
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        // 초기 구동
        initLightboxZoomEvents();
        fetchPhotos();
    </script>
</body>
</html>
